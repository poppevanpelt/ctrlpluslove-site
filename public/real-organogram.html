<!doctype html><html lang="en"><meta charset="utf-8"><title>The Real Organogram — ctrl+love</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{background:#e9e8dd;color:#26352e;font:16px system-ui;max-width:960px;margin:auto;padding:24px}section{background:#d8dfd0;border:1px solid #a5b29e;padding:20px;margin:20px 0;border-radius:12px}button,input,textarea,select{font:inherit;padding:10px;margin:5px}textarea{width:95%}svg{width:100%;background:#26352e;border-radius:8px}small{font-family:monospace}button{cursor:pointer}h1{font-size:clamp(32px,7vw,64px);letter-spacing:-.05em}</style><small>ctrl+love / DECISION ARCHITECTURE 001</small><h1>The Real Organogram.</h1><p>Fictional organization · objective: approve a product pilot with technical input.</p><section><select id="view"><option>Official</option><option>Actual</option><option>Intervention</option></select><svg id="graph" viewBox="0 0 600 350" role="img" aria-label="Decision network"></svg><p id="explain"></p></section><section><h2>Scenario controls</h2><label>Expertise access <input id="access" type="range" min="0" max="100" value="30"></label><label>Trust <input id="trust" type="range" min="0" max="100" value="50"></label><label>Alignment <input id="alignment" type="range" min="0" max="100" value="40"></label><p id="index"></p><p>Illustrative equal-weight index, not a success probability. All edges are hypotheses.</p><button id="reset">Reset scenario</button></section><script>const $=id=>document.getElementById(id),nodes=[['CEO',300,40],['Operations',120,130],['Finance',480,130],['Team lead',120,230],['Specialist',300,310],['Advisor',480,230]],formal=[[0,1],[0,2],[1,3],[3,4],[2,5]],actual=[[4,3],[3,5],[5,0],[2,0],[1,3]];function draw(){let mode=$('view').selectedIndex,a=+$('access').value,t=+$('trust').value,l=+$('alignment').value,edges=mode?actual:formal;function edge(i,j,color,width,dash=''){let [,x,y]=nodes[i],[,u,v]=nodes[j],d=Math.hypot(u-x,v-y);return '<line x1="'+(x+(u-x)*30/d)+'" y1="'+(y+(v-y)*30/d)+'" x2="'+(u-(u-x)*40/d)+'" y2="'+(v-(v-y)*40/d)+'" stroke="'+color+'" stroke-width="'+width+'" stroke-dasharray="'+dash+'" marker-end="url(#arrow)"/>'}$('graph').innerHTML='<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c5d4bd"/></marker></defs>'+edges.map(([i,j])=>edge(i,j,mode&&i===5?'#ff9d57':'#c5d4bd',mode&&i===5?4:2)).join('')+(mode===2?edge(4,0,'#80d8b0',1+a/20,'6 4'):'')+nodes.map(([n,x,y])=>'<rect x="'+(x-58)+'" y="'+(y-18)+'" width="116" height="36" rx="5" fill="#40594d" stroke="#c5d4bd"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" fill="white" font-size="14">'+n+'</text>').join('');$('explain').textContent=['Formal authority flows downward.','Hypothesis: advisor is an informal gatekeeper; specialist has indirect access.','Proposed direct specialist-to-CEO channel.'][$('view').selectedIndex];$('index').textContent='Access '+a+' · Trust '+t+' · Alignment '+l+' · Readiness '+Math.round((a+t+l)/3)+'/100'}for(let id of ['view','access','trust','alignment'])$(id).oninput=draw;$('reset').onclick=()=>{$('access').value=30;$('trust').value=50;$('alignment').value=40;draw()};draw()</script></html>
