name: Self-Repairing Workshop | Independent Verification
on:
  pull_request:
    paths:
      - "scripts/workshop-watchdog.mjs"
      - "tests/workshop-watchdog.test.mjs"
      - ".github/workflows/workshop-*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independently test the watchdog against local simulated failures
        run: node --test tests/workshop-watchdog.test.mjs
