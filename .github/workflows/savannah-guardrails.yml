name: Savannah guardrails

on:
  pull_request:
    paths:
      - "src/app/SavannahIntro.tsx"
      - "src/app/savannah-runtime.ts"
      - "src/app/savannah-widget.tsx"
      - "src/app/savannah-room/**"
      - "public/savannah-standalone.html"
      - "tests/savannah-runtime-guardrails.test.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
